[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgp4jax"
version = "0.1.1"
description = "JAX-compatible SGP4 satellite propagation"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
]

[project.optional-dependencies]
test = ["pytest", "sgp4>=2.0", "skyfield"]
docs = [
    "sphinx>=7.0",
    "furo",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sgp4jax"]
artifacts = ["src/sgp4jax/data/*.npz"]
