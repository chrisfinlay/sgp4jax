[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgp4jax"
version = "0.1.3"
description = "JAX-compatible SGP4 satellite propagation"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "numpy>=1.22",
]

[project.optional-dependencies]
test = ["pytest", "sgp4>=2.0", "skyfield"]
docs = [
    "sphinx>=7.0",
    "furo",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
]
examples = [
    "matplotlib>=3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sgp4jax"]
artifacts = ["src/sgp4jax/data/*.npz"]

[tool.pytest.ini_options]
markers = [
    "network: tests that require internet access (excluded by default)",
]
addopts = "-m 'not network'"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
[[tool.mypy.overrides]]
module = ["jax", "jax.*", "jaxlib.*"]
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_missing_imports = true
