[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgp4-jax"
version = "0.1.0"
description = "JAX-compatible SGP4 satellite propagation"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
]

[project.optional-dependencies]
test = ["pytest", "sgp4>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sgp4_jax"]
